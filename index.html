<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 style="color: #8b4513; text-align: center; margin-top: 20px;">TimberTusk Shop</h1>
        <nav>
            <a href="/">Trang chủ</a>
            <a href="/products">Sản phẩm</a>
            <a href="/contact">Liên hệ</a>
        </nav>
    </header>

    <main class="product-container">
        <img src="https://placeholder.com/600x400">
        <h2>Bàn Gỗ Sồi Tự Nhiên</h2>
        <p class="price">Giá: 4.500.000 VNĐ</p>
        
        <div class="btn-buy" onclick="handleAddToCart()">Thêm vào giỏ hàng</div>

        <section class="review-box">
            <h3>Đánh giá khách hàng</h3>
            <input type="text" placeholder="Nhập cảm nhận của bạn...">
            <button id="submit-review">Gửi đánh giá</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
