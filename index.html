<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Lỗi: Thiếu thẻ <title> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-container">
        <img src="https://noithathpro.com/ban-an-go-nguyen-khoi" alt="Bàn Gỗ TimberTusk">
        <h2>Bàn Gỗ Sồi Nga</h2>
        <p>Giá: 5,000,000 VNĐ</p>
        
        <!-- Lỗi: Dùng thẻ div thay vì button & viết inline onclick -->
        <div class="btn-add" onclick="addToCart()">Thêm vào giỏ hàng</div>

        <div class="reviews">
            <!-- Lỗi: Thiếu label hoặc aria-label -->
            <input type="text" placeholder="Nhập đánh giá...">
            <button id="submit-review">Gửi đánh giá</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
